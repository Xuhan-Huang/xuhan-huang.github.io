---
---
<!doctype html>
<html lang="{{ site.locale | default: 'en-US' | slice: 0, 2 }}">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#f6f7f4">
    <title>{% if page.title and page.title != '' %}{{ page.title }} · {% endif %}{{ site.title }}</title>
    <meta name="description" content="{{ page.description | default: site.description | strip_html | strip_newlines | escape }}">
    <link rel="canonical" href="{{ page.url | absolute_url }}">
    <link rel="icon" href="{{ '/images/favicon.svg' | relative_url }}" type="image/svg+xml">
    <link rel="icon" href="{{ '/images/favicon-32x32.png' | relative_url }}" sizes="32x32">
    <link rel="stylesheet" href="{{ '/assets/css/redesign.css' | relative_url }}?v={{ site.time | date: '%s' }}">
  </head>
  <body class="redesign-site {{ page.body_class }}">
    <a class="skip-link" href="#main-content">Skip to content</a>
    {% include redesign-nav.html %}

    {{ content }}

    {% include redesign-footer.html %}
  </body>
</html>
